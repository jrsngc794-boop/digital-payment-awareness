<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment History | DigitalPay Awareness</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f8ff;
    color:#10213a;
}

.navbar{
    background:white;
    border-bottom:1px solid #e4eaf2;
    padding:18px 7%;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:900;
    color:#155eef;
}

.nav-links{
    display:flex;
    gap:15px;
}

.nav-links a{
    text-decoration:none;
    color:#10213a;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:40px auto;
    padding:0 7%;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    color:#155eef;
}

.warning{
    background:#fff3cd;
    border:1px solid #ffe69c;
    padding:14px;
    border-radius:10px;
    text-align:center;
    margin-bottom:25px;
}

.history-card{
    background:white;
    border:1px solid #e4eaf2;
    border-radius:20px;
    padding:25px;

    box-shadow:
        0 10px 30px
        rgba(18,46,82,.08);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.clear-btn{
    border:none;
    background:#dc3545;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.payment{
    border:1px solid #e1e6ee;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    background:#fafcff;
}

.payment-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.receiver{
    font-size:19px;
    font-weight:bold;
}

.status{
    background:#d1e7dd;
    color:#0f5132;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.label{
    color:#718096;
    font-size:13px;
}

.value{
    font-weight:bold;
    margin-top:3px;
}

.amount{
    color:#155eef;
    font-size:19px;
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:#718096;
}

.empty-icon{
    font-size:50px;
}

.pay-btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 20px;
    background:#155eef;
    color:white;
    text-decoration:none;
    border-radius:9px;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    color:#718096;
}

@media(max-width:650px){

    .navbar{
        flex-direction:column;
        gap:15px;
    }

    .details{
        grid-template-columns:1fr;
    }

    .payment-top{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .top{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

}

</style>

</head>


<body>


<header class="navbar">

    <div class="logo">
        DigitalPay Awareness
    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="payment.html">
            Make Payment
        </a>

    </div>

</header>



<div class="container">


    <div class="title">

        <h1>
            🧾 Payment History
        </h1>

        <p>
            Your do payment transactions
        </p>

    </div>


    <div class="warning">

        ⚠️ This is a do payment system.
        No real money is transferred.

    </div>



    <div class="history-card">


        <div class="top">

            <h2>
                Transactions
            </h2>

            <button
                class="clear-btn"
                onclick="clearHistory()"
            >
                🗑 Clear History
            </button>

        </div>


        <div id="historyContainer"></div>


    </div>

</div>



<footer>

    Digital Payment Awareness |
    College Project

</footer>



<script>


/* ==========================================
   LOAD PAYMENT HISTORY
========================================== */

function loadHistory(){

    const container =
        document.getElementById(
            "historyContainer"
        );


    /*
       Get saved payments from browser
    */

    const savedData =
        localStorage.getItem(
            "doPayments"
        );


    console.log(
        "Saved payment data:",
        savedData
    );


    let transactions = [];


    if(savedData){

        try{

            transactions =
                JSON.parse(savedData);

        }

        catch(error){

            console.error(
                "Payment data error:",
                error
            );

            transactions = [];

        }

    }


    container.innerHTML = "";


    /* ======================================
       NO TRANSACTIONS
    ====================================== */

    if(
        !Array.isArray(transactions) ||
        transactions.length === 0
    ){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                <h3>
                    No Payment History
                </h3>

                <p>
                    No do payment has been
                    recorded in this browser.
                </p>

                <a
                    href="payment.html"
                    class="pay-btn"
                >
                    💳 Make Do Payment
                </a>

            </div>

        `;

        return;

    }


    /* ======================================
       DISPLAY TRANSACTIONS
    ====================================== */

    transactions.forEach(
        function(transaction){

            const payment =
                document.createElement(
                    "div"
                );


            payment.className =
                "payment";


            payment.innerHTML = `

                <div class="payment-top">

                    <div>

                        <div class="receiver">

                            🏪
                            ${escapeHTML(
                                transaction.receiver
                            )}

                        </div>

                        <small>

                            Transaction ID:
                            ${escapeHTML(
                                transaction.id
                            )}

                        </small>

                    </div>


                    <div class="status">

                        ✓
                        ${escapeHTML(
                            transaction.status ||
                            "Successful"
                        )}

                    </div>

                </div>



                <div class="details">


                    <div>

                        <div class="label">
                            Sender
                        </div>

                        <div class="value">

                            ${escapeHTML(
                                transaction.name
                            )}

                        </div>

                    </div>



                    <div>

                        <div class="label">
                            Amount
                        </div>

                        <div class="value amount">

                            ₹${Number(
                                transaction.amount
                            ).toFixed(2)}

                        </div>

                    </div>



                    <div>

                        <div class="label">
                            UPI ID
                        </div>

                        <div class="value">

                            ${escapeHTML(
                                transaction.upi
                            )}

                        </div>

                    </div>



                    <div>

                        <div class="label">
                            Payment Method
                        </div>

                        <div class="value">

                            ${escapeHTML(
                                transaction.method
                            )}

                        </div>

                    </div>



                    <div>

                        <div class="label">
                            Date & Time
                        </div>

                        <div class="value">

                            ${escapeHTML(
                                transaction.date
                            )}

                        </div>

                    </div>


                </div>

            `;


            container.appendChild(
                payment
            );

        }
    );

}



/* ==========================================
   CLEAR HISTORY
========================================== */

function clearHistory(){

    const confirmation =
        confirm(
            "Delete all do payment history?"
        );


    if(confirmation){

        localStorage.removeItem(
            "doPayments"
        );


        loadHistory();


        alert(
            "Payment history deleted."
        );

    }

}



/* ==========================================
   SECURITY
========================================== */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value ?? ""
        );


    return div.innerHTML;

}



/* ==========================================
   START
========================================== */

loadHistory();

</script>


</body>

</html>
